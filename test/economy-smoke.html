<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolphin Drift · economy checks</title>
<style>body{font:14px/1.5 system-ui;margin:20px;background:#f5f6ef;color:#214e48}iframe{display:block;border:1px solid #a8c5b4;width:100%;height:850px}.fail{color:#a32d24;white-space:pre-wrap}li{margin:4px 0}button{margin:8px;padding:8px}</style>
<h1>Progression and reward checks</h1>
<p>Real controls with an isolated debug profile. Existing browser saves stay untouched.</p>
<output id="status" role="status">Running…</output><ol id="results"></ol>
<button id="phone">Phone preview</button><button id="desktop">Desktop preview</button>
<iframe id="game" src="../?debug" title="Economy test game"></iframe>
<script type="module">
const frame=document.getElementById('game'), results=document.getElementById('results'), status=document.getElementById('status');
const assert=(value,message)=>{if(!value)throw new Error(message);};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let passed=0,current='Boot';
const test=async(name,run)=>{current=name;await run();passed++;const li=document.createElement('li');li.textContent=`PASS · ${name}`;results.append(li);};
const saved=()=>{try{return JSON.stringify(['dolphin-drift-profile','dolphin-drift-best'].map(key=>localStorage.getItem(key)));}catch{return null;}};
const before=saved();
try{
  const start=performance.now();
  while(!frame.contentWindow?.__drift){assert(performance.now()-start<10000,'Game did not load');await wait(25);}
  const child=frame.contentWindow,doc=frame.contentDocument,{game,audio}=child.__drift;
  const $=id=>doc.getElementById(id),profile=()=>child.__drift.profile;
  const {createProfile,settleRun}=await import('../src/progression.js');
  const home=()=>doc.querySelector('.brand').click();
  const clear=()=>{game.objects=[];game._nextRow=Infinity;};
  const tick=async()=>{frame.scrollIntoView({block:'start'});for(let i=0;i<3;i++)await new Promise(resolve=>child.requestAnimationFrame(resolve));await wait(70);};
  const receiptTotal=()=>[...$('reward-breakdown').querySelectorAll('dd')].reduce((total,row)=>total+Number(row.textContent.replace(/[^0-9]/g,'')),0);
  const crash=async(distance,records,stunts=0)=>{clear();game.elapsedTime=10;game.distance=distance;game.stats.records=records;game.stats.stunts=stunts;game.state='over';await tick();};
  $('sound').click();$('sound').click();audio.disable();

  await test('Shop shows exact upgrade effects, prices, affordability and purchase result',async()=>{
    $('shop-open').click();
    [...$('shop-tabs').children].find(button=>button.textContent==='Upgrades').click();
    assert($('shop-items').children.length===7,'Expected seven permanent upgrade tracks');
    for(const [name,benefit] of [['Bubble stabilizer','12s → 14s'],['Phase tuner','6s → 7s'],['Spring coils','12s → 14s'],['Dash extender','3s → 3.5s']]){
      const added=[...$('shop-items').children].find(item=>item.textContent.includes(name));
      assert(added?.textContent.includes(benefit),`Missing ${name} or its next-level benefit`);
    }
    const card=$('shop-items').children[0];
    assert(card.textContent.includes('10s → 12s')&&card.textContent.includes('Buy · 60'),'Missing level benefit or price');
    card.querySelector('button').click();
    assert(profile().wallet===190&&profile().shop.upgrades['magnet-upgrade']===1,'Purchase did not debit exactly 60');
    assert($('shop-items').children[0].textContent.includes('12s → 14s'),'Next upgrade benefit stale');
    $('shop-close').click();
  });
  await test('Crash receipt sums to the wallet delta and celebrates a collection crew unlock',async()=>{
    profile().totalRecords=80;
    const baseline=createProfile(profile());
    $('start').click();game.coins=90;
    await crash(250,20,2);
    const expected=settleRun(baseline,game);
    assert(profile().wallet===expected.profile.wallet,'Saved wallet disagrees with settlement');
    assert(receiptTotal()===profile().wallet-baseline.wallet,'Displayed receipt does not reconcile');
    assert($('result-coins').textContent==='80','The main result should show banked earnings, not remaining run currency');
    assert($('xp-earned').textContent.includes('+80 banked records'),'Headline must include every payout');
    assert($('unlocked').textContent.includes('Crew joined: Inky'),'Missing crew celebration');
    assert($('reward-next').textContent.includes('Riff')&&$('reward-next').textContent.includes('100 / 300'),'Missing next crew goal');
  });
  await test('Revive, pause and early return replace the receipt without duplicate rewards',async()=>{
    const firstWallet=profile().wallet;
    $('revive').click();clear();game.stats.records=50;game.distance=750;game.elapsedTime=20;
    $('pause').click();
    assert($('reward-receipt').classList.contains('hidden'),'Pause must not display the previous crash receipt');
    home();await tick();
    assert(profile().runs===1&&profile().totalRecords===130,'Continued run was counted twice');
    assert(profile().wallet===firstWallet+90,'Only new collection and milestones should add to wallet');
    const wallet=profile().wallet;home();assert(profile().wallet===wallet,'Repeated home paid twice');
  });
  await test('Collection unlock can be selected without opening later Story chapters',async()=>{
    $('crew-open').click();
    const inky=$('crew-cards').children[1];
    assert(!inky.disabled,'Lifetime collection did not unlock Inky');inky.click();
    assert(profile().loadout.character==='octo','Inky selection not saved');
    assert($('island-nodes').children[1].disabled,'Collection improperly unlocked Story chapter two');
    assert($('crew-cards').children[2].textContent.includes('130 / 300'),'Locked crew progress not shown');
    $('adventure-close').click();
  });
  await test('Daily ignores selected crew, upgrades and supplies while retaining banked rewards',async()=>{
    profile().preferences.supply='supply-shield';profile().shop.supplies['supply-shield']=2;
    profile().preferences.modifier='rich';
    $('mode-daily').click();$('start').click();clear();
    assert(game.character==='dub'&&game.modifier==='none'&&game.powerDuration('magnet')===10,'Daily loadout is not normalized');
    assert(game.coins===0&&game.powerups.shield===0&&profile().shop.supplies['supply-shield']===2,'Daily used bank/supply benefits');
    const base=profile().wallet;
    await crash(250,20);
    assert(profile().wallet-base===60&&receiptTotal()===60,'Daily should earn ordinary banked rewards');
    assert(game.coins===0,'Bank rewards leaked into run currency');home();
  });
  await test('Receipts and their actions fit phone, landscape and desktop layouts',async()=>{
    $('mode-endless').click();
    for(const [width,height] of [[320,568],[390,844],[844,390],[1280,900]]){
      frame.style.width=width+'px';frame.style.height=height+'px';
      $('start').click();await crash(1500,100,10);
      const modal=doc.querySelector('.modal'),bounds=modal.getBoundingClientRect(),shell=$('game-shell').getBoundingClientRect();
      assert(bounds.left>=shell.left&&bounds.right<=shell.right&&bounds.bottom<=shell.bottom,`${width}px receipt clipped`);
      assert(modal.scrollWidth<=modal.clientWidth+1,`${width}px receipt has horizontal overflow`);
      modal.scrollTop=modal.scrollHeight;
      assert($('home').getBoundingClientRect().bottom<=bounds.bottom,`${width}px home unreachable`);
      assert(receiptTotal()>0,'Receipt missing');home();
    }
  });
  await test('Debug integration leaves existing saves untouched',async()=>assert(saved()===before,'Normal save changed'));
  frame.style.width='100%';frame.style.height='950px';
  $('start').click();await crash(750,50,5);
  doc.querySelector('.modal').scrollTop=0;
  document.getElementById('phone').onclick=()=>{frame.style.width='390px';frame.style.height='844px';frame.scrollIntoView();};
  document.getElementById('desktop').onclick=()=>{frame.style.width='100%';frame.style.height='950px';frame.scrollIntoView();};
  status.textContent=`PASS · All ${passed} economy checks passed.`;status.dataset.state='passed';
}catch(error){status.textContent=`FAIL · ${current} (${passed} passed)`;status.dataset.state='failed';const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);}
</script>
</html>
