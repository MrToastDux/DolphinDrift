<!doctype html><meta charset="utf-8"><title>Route rendering regression checks</title>
<style>body{margin:16px;background:#142d37;color:#e6f7ea;font:14px system-ui}button,select,input{padding:8px;margin:4px}canvas{display:block;width:100%;height:620px;border-radius:18px}#view{max-width:1100px}#status{color:#b9f8c5;padding:8px}#controls{position:sticky;top:0;background:#142d37;z-index:2}</style>
<h1>Optional route rendering</h1><div id="controls"><select id="route" aria-label="Route"><option value="0">Reef tunnel</option><option value="1">Market rooftops</option><option value="2">Cargo docks</option></select><select id="position" aria-label="Position"><option value="-130" selected>Fork plaza</option><option value="-45">Approaching</option><option value="0">Entrance</option><option value="75">Inside</option><option value="178">Exit edge</option><option value="190">After exit</option></select><button id="motion">Play / pause</button><button id="mobile">Mobile / desktop</button><button id="flight">Flight / ground</button><button id="effects">Reduced effects</button><button id="quality">Low / high detail</button><p id="status"></p></div><div id="view"><canvas id="world" aria-label="Optional route rendering preview"></canvas></div>
<script type="module">
import { Game } from '/src/game.js';import { Renderer } from '/src/renderer.js';import {forkAt} from '/src/routes.js';
const c=document.querySelector('canvas'),r=new Renderer(c),g=new Game({mode:'tour',seed:37}),status=document.querySelector('#status');r.camera=1;
let playing=false,flight=false;g.start();g.state='paused';
function setup(){const i=Number(document.querySelector('#route').value),route=forkAt(i);g.distance=route.start+Number(document.querySelector('#position').value);g.forkIndex=i;g.routeChoices=new Map([[i,true]]);g.objects=[];g._nextRow=Math.max(g.distance+20,route.start+20);g._fillTrack();g.drainEvents();g.player.x=0;g.player.lane=0;g.reviveGrace=999;g.player.altitude=flight?4.2:0;g.surfRemaining=flight?100:0;r.flightCamera=g.player.altitude;}
setup();document.querySelector('#route').onchange=setup;document.querySelector('#position').onchange=setup;
document.querySelector('#motion').onclick=()=>playing=!playing;
document.querySelector('#mobile').onclick=()=>{document.querySelector('#view').style.width=document.querySelector('#view').style.width==='375px'?'100%':'375px';r.resize();};
document.querySelector('#flight').onclick=()=>{flight=!flight;setup();};
document.querySelector('#effects').onclick=()=>r.reducedMotion=!r.reducedMotion;
document.querySelector('#quality').onclick=()=>r.setQuality(r.effectiveQuality==='low'?'high':'low');
new ResizeObserver(()=>r.resize()).observe(c);
let last=performance.now();function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{
 if(playing){g.state='playing';g.update(dt);if(g.distance>forkAt(Number(document.querySelector('#route').value)).end+25)setup();}else g.state='paused';
 r.draw(g,playing?dt:0,now/1000);status.textContent=`Rendered · ${Math.floor(g.distance)} m · ${r.effectiveQuality} · ${flight?'flight':'ground'} · ${playing?'moving':'paused'}`;
 requestAnimationFrame(draw);
}catch(e){status.textContent='FAIL: '+e.stack;}}requestAnimationFrame(draw);
</script>
